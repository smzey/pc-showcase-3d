<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D PC Buyer Inspector — i5-14400F • ASUS RTX 5060 8GB • 32GB RAM</title>
    <meta
      name="description"
      content="ตรวจเช็กสเปกคอมเกมมิ่งแบบ 3 มิติ หมุนดูชิ้นส่วน แยกชิ้นส่วน ดูรูปสินค้าจริงและผลตรวจเช็กเครื่อง (Intel i5-14400F / ASUS RTX 5060 8GB / 32GB RAM / 2.25TB Storage)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- 3D Canvas Stage -->
      <main class="stage-wrap">
        <canvas id="pc-canvas" aria-label="Interactive 3D PC Model"></canvas>

        <!-- Hover Tooltip -->
        <div id="hover-tooltip" class="hover-tooltip hidden" role="status" aria-live="polite">
          <span class="tooltip-dot"></span>
          <div class="tooltip-text">
            <strong id="tooltip-title"></strong>
            <span id="tooltip-sub"></span>
          </div>
        </div>

        <!-- Top Floating Header -->
        <header class="top-bar">
          <div class="brand-pill">
            <div class="brand-badge">3D INSPECT</div>
            <div class="brand-titles">
              <h1 id="header-title">i5-14400F • ASUS RTX 5060 8GB</h1>
              <p id="header-sub">RAM 32GB • NVMe 1.25TB + HDD 1TB • คลิกดูรูปและสเปกจริงทุกชิ้น</p>
            </div>
          </div>

          <div class="top-actions">
            <div class="status-pill" id="status-pill">
              <span class="status-live-dot"></span>
              <span id="status-pill-text">พร้อมเทสก่อนรับ</span>
            </div>
            <button id="lang-toggle" class="icon-btn" type="button" title="Switch Thai / English">
              <span id="lang-label">EN</span>
            </button>
            <button id="drawer-toggle" class="icon-btn mobile-only" type="button" aria-label="Toggle Inspector">
              <span id="drawer-toggle-label">ดูสเปก</span>
            </button>
          </div>
        </header>

        <!-- Hint Banner -->
        <div class="hint-chip" id="hint-chip">
          <span class="pulse-dot"></span>
          <span id="hint-text">ลากเพื่อหมุน • ซูมเข้าออก • คลิกชิ้นส่วนในเครื่องเพื่อดูรูปสินค้าจริงและสเปก</span>
        </div>

        <!-- Bottom Floating 3D Control Dock -->
        <div class="controls-dock" role="toolbar" aria-label="3D View Controls">
          <div class="dock-row">
            <button id="btn-glass" class="dock-btn active" type="button">
              <span class="btn-icon">🪟</span>
              <span data-i18n="glassBtn">ปิดฝาข้าง</span>
            </button>
            <button id="btn-explode" class="dock-btn" type="button">
              <span class="btn-icon">💥</span>
              <span data-i18n="explodeBtn">แยกชิ้นส่วน</span>
            </button>
            <button id="btn-cooler" class="dock-btn" type="button">
              <span class="btn-icon">❄️</span>
              <span data-i18n="coolerBtn">ซ่อนซิงค์ CPU</span>
            </button>
            <button id="btn-monitor" class="dock-btn" type="button">
              <span class="btn-icon">🖥️</span>
              <span data-i18n="monitorBtn">ดูพร้อมจอ 30"</span>
            </button>
            <button id="btn-rgb" class="dock-btn" type="button">
              <span class="btn-icon">✨</span>
              <span id="rgb-label">RGB: Cyan</span>
            </button>
            <button id="btn-reset" class="dock-btn" type="button">
              <span class="btn-icon">↺</span>
              <span data-i18n="resetBtn">รีเซ็ตมุมมอง</span>
            </button>
          </div>

          <div class="explode-slider-row">
            <label for="explode-range" data-i18n="explodeSlider">ระยะแยกชิ้นส่วน (Exploded View)</label>
            <input id="explode-range" type="range" min="0" max="100" value="0" />
            <span id="explode-pct" class="mono">0%</span>
          </div>
        </div>
      </main>

      <!-- Right Buyer Inspector Drawer -->
      <aside id="inspector-drawer" class="inspector-drawer">
        <!-- Tabs (Buyer-focused: No Pricing) -->
        <nav class="drawer-tabs" role="tablist">
          <button class="tab-btn active" data-tab="inspect" role="tab" aria-selected="true" data-i18n="tabInspect">
            ชิ้นส่วน & รูป
          </button>
          <button class="tab-btn" data-tab="health" role="tab" aria-selected="false" data-i18n="tabHealth">
            ผลตรวจเช็ก
          </button>
          <button class="tab-btn" data-tab="specs" role="tab" aria-selected="false" data-i18n="tabSpecs">
            สเปกทั้งหมด
          </button>
        </nav>

        <!-- TAB 1: INSPECT WITH PRODUCT IMAGE -->
        <section id="tab-inspect" class="tab-panel active">
          <div id="selected-card" class="spotlight-card"></div>

          <div class="legend-row">
            <span class="badge verified" data-i18n="badgeVerified">✓ ตรวจจากระบบจริง</span>
            <span class="badge unverified" data-i18n="badgeUnverified">⚠ สอบถามรูปจริงจากผู้ขาย</span>
          </div>

          <div id="part-list" class="part-list"></div>
        </section>

        <!-- TAB 2: HEALTH & DIAGNOSTICS -->
        <section id="tab-health" class="tab-panel">
          <div id="health-content"></div>
        </section>

        <!-- TAB 3: FULL SPEC SHEET -->
        <section id="tab-specs" class="tab-panel">
          <div class="spec-sheet-header">
            <button id="btn-copy-specs" class="primary-btn" type="button" data-i18n="copySpecsBtn">
              📋 คัดลอกสเปกทั้งหมด
            </button>
          </div>
          <div id="copy-toast" class="copy-toast hidden"></div>
          <div id="full-specs-content" class="full-specs-list"></div>
        </section>
      </aside>
    </div>

    <!-- Product Image Fullscreen Lightbox -->
    <div id="image-lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Product image zoom">
      <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
      <div class="lightbox-card">
        <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close">✕</button>
        <div class="lightbox-img-wrap">
          <img id="lightbox-img" src="" alt="" />
        </div>
        <div class="lightbox-caption">
          <strong id="lightbox-title"></strong>
          <span id="lightbox-note"></span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
